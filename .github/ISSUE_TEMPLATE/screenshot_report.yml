name: Screenshot report
description: Submit or discuss curated screenshots.
title: "[Screenshot] "
labels: ["screenshots", "qa"]
body:
  - type: input
    id: filename
    attributes:
      label: Screenshot filename or link
  - type: textarea
    id: notes
    attributes:
      label: Notes
  - type: checkboxes
    id: checklist
    attributes:
      label: Screenshot checklist
      options:
        - label: The screenshot is PNG.
          required: true
        - label: The screenshot has no private overlays or local paths.
          required: true
        - label: I did not attach ROMs, saves, states, BIOS files, credentials, or private files.
          required: true
