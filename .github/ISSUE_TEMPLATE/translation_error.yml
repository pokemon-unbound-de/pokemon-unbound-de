name: Report a translation error (English)
description: Report a German translation issue.
title: "[Translation] "
labels: ["translation"]
body:
  - type: input
    id: patch_version
    attributes:
      label: Patch version
      description: Shown in the patch file name or on the release page.
      placeholder: e.g. v0.1-beta
  - type: input
    id: location
    attributes:
      label: Location or pointer
      description: Scene, pointer, file, or area if known.
  - type: textarea
    id: current_text
    attributes:
      label: Current German text
  - type: textarea
    id: expected_text
    attributes:
      label: Suggested correction
  - type: textarea
    id: context
    attributes:
      label: Source/context
      description: Add English context or screenshot reference if safe.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I did not attach ROMs, patched ROMs, emulator save states, BIOS files, credentials, or private files.
          required: true
