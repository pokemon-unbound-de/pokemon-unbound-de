name: Beta v0.1 veröffentlichen

# Veröffentlicht den vorbereiteten Release-Entwurf "v0.1-beta" am 08.10.2026 um 08:00 UTC.
# Idempotent: Ist der Release schon veröffentlicht, passiert nichts. Fehlt der Entwurf, schlägt der Job sichtbar fehl.
# Hinweis: GitHub startet geplante Workflows teils mit einigen Minuten Verzögerung; manuell über "Run workflow" möglich.
on:
  schedule:
    - cron: "0 8 8 10 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-beta
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Entwurf v0.1-beta veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: v0.1-beta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y)" != "2026" ]; then
            echo "Geplanter Lauf außerhalb von 2026 – nichts zu tun."
            exit 0
          fi
          status=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft' 2>/dev/null || echo "fehlt")
          if [ "$status" = "fehlt" ]; then
            echo "::error::Release-Entwurf $TAG existiert nicht."
            exit 1
          fi
          if [ "$status" = "false" ]; then
            echo "$TAG ist bereits veröffentlicht – nichts zu tun."
            exit 0
          fi
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          echo "$TAG veröffentlicht."
